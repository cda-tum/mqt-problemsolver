[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs>=0.4", "hatchling>=1.27" ]


[project]
name = "mqt-problemsolver"
description = "MQT ProblemSolver - A MQT tool for Solving Problems Using Quantum Computing"
readme = "README.md"
keywords = [ "MQT", "quantum computing" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "docplex>=2.28.240",
  "joblib>=1.4.2",
  "jsonschema>=4.20",
  "matplotlib>=3.9.4",
  "matplotlib>=3.10.5; python_version>='3.14'",
  "matplotlib>=3.11.2; python_version>='3.15'",
  "mqt-bench>=2.0.1",
  "mqt-core>=3.8,<4",
  "networkx>=2.8.8",
  "numpy>=1.24",
  "numpy>=1.26; python_version>='3.12'",
  "numpy>=2.1; python_version>='3.13'",
  "numpy>=2.3.2; python_version>='3.14'",
  "numpy>=2.5.2; python_version>='3.15'",
  "openpyxl>=3.1.5",
  "pandas>=2.1.2",
  "pandas>=2.2.3; python_version>='3.13'",
  "pandas>=2.3.3; python_version>='3.14'",
  "pandas>=3.0.6; python_version>='3.15'",
  "python-tsp>=0.5",
  "pytket>=1.29",
  "pytket>=2.4; python_version>='3.14'",
  "pytket-qiskit>=0.71.1",
  "pytket-qiskit>=0.78; python_version>='3.14'",
  "qdk[qiskit]>=1.20",
  "qdk[qiskit]>=1.29.1; python_version>='3.15'",
  "qiskit>=2.1.1,<3",
  "qiskit-aer>=0.16.4; python_version<'3.14'",
  "qiskit-ibm-runtime>=0.30",
  "referencing>=0.37",
  "scipy>=1.13.1",
  "scipy>=1.14.1; python_version>='3.13'",
  "scipy>=1.16.1; python_version>='3.14'",
  "scipy>=1.18.1; python_version>='3.15'",
  "z3-solver>=4.15.3",
]

[[project.authors]]
name = "Nils Quetschlich"
email = "nils.quetschlich@tum.de"

[[project.authors]]
name = "Lukas Burgholzer"
email = "burgholzer@me.com"

[[project.authors]]
name = "Tobias Forster"
email = "tobias.forster@tum.de"

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/problemsolver"
"Bug Tracker" = "https://github.com/munich-quantum-toolkit/problemsolver/issues"
Discussions = "https://github.com/munich-quantum-toolkit/problemsolver/discussions"
Research = "https://www.cda.cit.tum.de/research/quantum/"


[dependency-groups]
dev = [
  { include-group = "test" },
  "nox>=2025.11.12",
]
test = [
  "pytest>=9.0.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
]
docs = [
  "furo>=2025.12.19",
  "myst-nb>=1.4",
  "sphinx>=9",
  "sphinx-autoapi>=3.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=1",
  "sphinxcontrib-bibtex>=2.7",
  "sphinxext-opengraph>=0.13",
]


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mqt/problemsolver/_version.py"

[tool.hatch.build.targets.wheel]
packages = [ "src/mqt" ]


[tool.uv.sources]
mqt-problemsolver = { workspace = true }


[tool.ruff]
line-length = 120
namespace-packages = [ "mqt" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [ "D" ]  # pydocstyle
"*.ipynb" = [
  "D",    # pydocstyle
  "E402", # Allow imports to appear anywhere in Jupyter notebooks
  "I002", # Allow missing `from __future__ import annotations` import
]

[tool.ruff.lint.isort]
known-first-party = [ "mqt.problemsolver" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
extend-select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "D",     # pydocstyle
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "FA",    # flake8-future-annotations
  "FLY",   # flynt
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "N",     # flake8-naming
  "NPY",   # numpy
  "PERF",  # perflint
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "YTT",   # flake8-2020
]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D107",
  "E501", # Line too long (Black is enough)
  "PLR",  # Design-related pylint codes
  "S101", # Use of assert detected
]
flake8-unused-arguments.ignore-variadic-names = true
future-annotations = true


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.check-sdist]
sdist-only = [ "src/mqt/problemsolver/_version.py" ]


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  '"id": ".*",',
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on" # ignore block
]

[tool.typos.default.extend-words]
wille = "wille"
anc = "anc"
aer = "aer"

[tool.typos.files]
extend-exclude = [ "*.tsx", "package-lock.json" ]


[tool.ty.src]
exclude = [
  "docs/**",
  "notebooks/**",
]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [
  "-ra",
  "--showlocals",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
  # Qiskit 2.1 internal deprecations
  """\
  ignore:.*``qiskit.circuit.library.blueprintcircuit.BlueprintCircuit`` is deprecated as of Qiskit \
  2.1.*:DeprecationWarning:qiskit.*\
  """,
  """\
  ignore:.*``qiskit.circuit.library.n_local.n_local.NLocal`` is deprecated as of Qiskit \
  2.1.*:DeprecationWarning:qiskit.*\
  """,
  # Qiskit 2.2 internal deprecations
  "ignore:.*``qiskit.circuit.library.phase_oracle.PhaseOracle`` is deprecated as of Qiskit 2.2.*:DeprecationWarning",
  "ignore:.*Trying to add QuantumRegister to a QuantumCircuit having a layout.*:UserWarning:qiskit.*",
  # QDK 1.28.0 internal deprecations
  "ignore:.*This version of QRE is deprecated and will be removed in a future release.*:DeprecationWarning",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "tests" ]


[tool.coverage]
precision = 1
show_missing = true
skip_empty = true

[tool.coverage.run]
source = [ "mqt.problemsolver" ]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  '\.\.\.',
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]
